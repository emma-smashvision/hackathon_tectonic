@keyframes drop{0%,40%{transform:translateY(0);opacity:0}50%{opacity:1}90%{transform:translateY(14px);opacity:0}100%{opacity:0}}
.hop{animation:hop .9s cubic-bezier(.45,0,.55,1) infinite}
.box{transform-box:fill-box;transform-origin:center;animation:hopbox .9s cubic-bezier(.45,0,.55,1) infinite;animation-delay:.08s}
.curls{animation:curls .9s cubic-bezier(.45,0,.55,1) infinite;animation-delay:.18s}
.drop{animation:drop 2.7s ease-in infinite}
</style>
