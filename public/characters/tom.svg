@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-7px)}}
@keyframes hopbox{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-13px) rotate(-2.5deg)}}
