<clipPath id="k-o"><circle cx="150" cy="160" r="125"/></clipPath>
<filter id="k-s" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1B1530" flood-opacity=".18"/></filter>
