<style>
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

@keyframes tilt{0%,100%{transform:rotate(0)}50%{transform:rotate(2.5deg)}}
@keyframes brows{0%,70%,100%{transform:translateY(0)}78%,90%{transform:translateY(-4px)}}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.8);opacity:0}}
@keyframes coin{0%{transform:translateY(0) scale(0);opacity:0}12%{transform:translateY(0) scale(1.15);opacity:1}20%{transform:translateY(-2px) scale(1)}70%{transform:translateY(-18px) scale(1);opacity:1}85%,100%{transform:translateY(-22px) scale(1);opacity:0}}
.tilt{transform-box:view-box;transform-origin:150px 165px;animation:tilt 5s cubic-bezier(.45,0,.55,1) infinite}
.brows{animation:brows 5s cubic-bezier(.45,0,.55,1) infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 1.8s ease-out infinite}
.coin{transform-box:fill-box;transform-origin:center;animation:coin 3.6s cubic-bezier(.3,0,.3,1) infinite;opacity:0}
.c2{animation-delay:1.2s}.c3{animation-delay:2.4s}
</style>
