<style>
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(-2deg)}}
@keyframes glow{0%,100%{fill:#BFE3D2}50%{fill:#FFD36B}}
@keyframes heart{0%{transform:translateY(0) scale(.4);opacity:0}20%{opacity:1;transform:translateY(-8px) scale(1)}100%{transform:translateY(-50px) scale(1.1);opacity:0}}
@keyframes peek{0%,12%{transform:translateX(48px) rotate(8deg)}30%,70%{transform:translateX(0) rotate(0)}88%,100%{transform:translateX(48px) rotate(8deg)}}
.bob{animation:bob 5s cubic-bezier(.45,0,.55,1) infinite}
.float{transform-box:fill-box;transform-origin:50% 100%;animation:float 4s cubic-bezier(.45,0,.55,1) infinite}
.g1{animation:glow 3s ease-in-out infinite}.g2{animation:glow 3s ease-in-out infinite;animation-delay:1.5s}
.heart{transform-box:fill-box;transform-origin:center;animation:heart 3.2s ease-out infinite}.h2{animation-delay:1.6s}
.peek{transform-box:view-box;transform-origin:256px 300px;animation:peek 8s cubic-bezier(.45,0,.55,1) infinite}
</style>
