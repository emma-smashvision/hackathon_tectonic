<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="600" height="600">
<!-- Nadia, 47 (synthetic demo character). Drawn for KBC One in the style of the other cast portraits. -->
<defs>
<clipPath id="n-c"><circle cx="150" cy="160" r="125"/><rect x="0" y="0" width="300" height="160"/></clipPath>
<filter id="n-s" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1B1530" flood-opacity=".18"/></filter>
</defs>
<style>
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 6s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.bob{animation:bob 7s cubic-bezier(.45,0,.55,1) infinite}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-10px)}}
.steam{animation:steam 4s ease-in-out infinite}.s2{animation-delay:1.3s}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
