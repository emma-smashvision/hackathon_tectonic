<style>
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

@keyframes lean{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(3px) scale(1.02)}}
@keyframes headlean{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(3px) rotate(2deg)}}
@keyframes draw{0%{stroke-dashoffset:100;opacity:1}55%{stroke-dashoffset:0}85%{stroke-dashoffset:0;opacity:1}95%{opacity:0}100%{stroke-dashoffset:100;opacity:0}}
@keyframes arrow{0%,52%{opacity:0}57%,67%,77%{opacity:1}62%,72%{opacity:.2}88%{opacity:1}95%,100%{opacity:0}}
@keyframes area{0%,40%{opacity:0}60%,85%{opacity:1}95%,100%{opacity:0}}
.lean{transform-box:view-box;transform-origin:150px 300px;animation:lean 5s cubic-bezier(.45,0,.55,1) infinite}
.hl{transform-box:view-box;transform-origin:150px 165px;animation:headlean 5s cubic-bezier(.45,0,.55,1) infinite}
.draw{stroke-dasharray:100;animation:draw 4s cubic-bezier(.45,0,.55,1) infinite}
.arrow{animation:arrow 4s linear infinite}
.area{animation:area 4s linear infinite}
</style>
