@keyframes lit{0%,4%,22%,100%{fill:#E3DAF5}10%,14%{fill:#7B5BD6}}
@keyframes thumb{0%,100%{transform:translate(0,0)}10%{transform:translate(-5px,0)}20%{transform:translate(0,0)}33%{transform:translate(0,20px)}43%{transform:translate(-5px,20px)}53%{transform:translate(0,20px)}66%{transform:translate(0,40px)}76%{transform:translate(-5px,40px)}86%{transform:translate(0,40px)}}
.bob{animation:bob 6s cubic-bezier(.45,0,.55,1) infinite}
.nod{transform-box:view-box;transform-origin:150px 165px;animation:nod 7s cubic-bezier(.45,0,.55,1) infinite}
.lit{animation:lit 6s ease-in-out infinite}.l2{animation-delay:1.98s}.l3{animation-delay:3.96s}
.thumb{animation:thumb 6s cubic-bezier(.45,0,.55,1) infinite}
</style>
