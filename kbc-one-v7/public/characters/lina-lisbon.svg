<style>
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes pony{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.bob{animation:bob 2.2s cubic-bezier(.45,0,.55,1) infinite}
.sway{transform-box:view-box;transform-origin:150px 165px;animation:sway 2.2s cubic-bezier(.45,0,.55,1) infinite}
.pony{transform-box:view-box;transform-origin:184px 88px;animation:pony 1.1s cubic-bezier(.45,0,.55,1) infinite}
.orbit{transform-box:view-box;transform-origin:150px 112px;animation:orbit 5s linear infinite}
.sun{transform-box:fill-box;transform-origin:center;animation:spin 18s linear infinite}
.pass{transform-box:fill-box;transform-origin:center;animation:wiggle 2.2s cubic-bezier(.45,0,.55,1) infinite}
</style>
